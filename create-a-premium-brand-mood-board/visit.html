<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Visit | IEA Stays</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="forms.css" />
  </head>
  <body>
    <main class="form-page">
      <section class="form-brand">
        <a class="wordmark" href="index.html"><span>✦</span> IEA Stays</a>
        <div>
          <h1>Book a visit to an Aries home.</h1>
          <p>Share your contact details and preferred visit window. The IEA Stays team can follow up with availability and next steps.</p>
        </div>
      </section>
      <section class="form-shell">
        <form class="lead-form">
          <p class="kicker">Visit Request</p>
          <h2>Tell us how to reach you</h2>
          <div class="fields">
            <label>Full name<input required name="name" /></label>
            <label>Phone number<input required name="phone" type="tel" /></label>
            <label>Email<input required name="email" type="email" /></label>
            <label>Preferred home<select name="home"><option>Studio</option><option>Nest</option><option>BNB</option></select></label>
            <label>Preferred date<input name="date" type="date" /></label>
            <label>Preferred time<select name="time"><option>Morning</option><option>Afternoon</option><option>Evening</option></select></label>
            <label class="full">Message<textarea name="message" placeholder="Any questions or requirements?"></textarea></label>
          </div>
          <div class="form-actions">
            <button class="submit-btn" type="submit">Submit request</button>
            <a class="back-link" href="index.html">Back home</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
