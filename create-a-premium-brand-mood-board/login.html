<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | IEA Stays</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="forms.css" />
  </head>
  <body>
    <main class="form-page">
      <section class="form-brand">
        <a class="wordmark" href="index.html"><span>✦</span> IEA Stays</a>
        <div>
          <h1>Welcome back.</h1>
          <p>Log in to continue your IEA Stays enquiry, saved homes, and visit requests.</p>
        </div>
      </section>
      <section class="form-shell">
        <form class="lead-form">
          <p class="kicker">Resident Login</p>
          <h2>Access your account</h2>
          <div class="fields">
            <label class="full">Email<input required type="email" name="email" /></label>
            <label class="full">Password<input required type="password" name="password" /></label>
          </div>
          <div class="form-actions">
            <button class="submit-btn" type="submit">Log in</button>
            <a class="back-link" href="index.html">Back home</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
