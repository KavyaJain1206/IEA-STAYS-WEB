name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m

          script: |
            cd /var/www/IEA-STAYS-WEB

            git pull origin main

            cd website
            npm install
            npm run build

            cd ../backend

            source venv/bin/activate
            pip install -r requirements.txt

            sudo systemctl restart ieastays-backend
            sudo systemctl restart nginx